<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silkroad Timer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --panel: #111827;
      --border: #263349;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --green: #34d399;
      --red: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #192342 0%, var(--bg) 58%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .container {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 32px;
    }

    .brand {
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .brand span { color: #a78bfa; }

    .subtitle { color: var(--muted); font-size: 13px; margin-top: 5px; }

    .panel, .timer-card {
      background: rgba(17, 24, 39, .94);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .panel { padding: 22px; margin-bottom: 24px; }

    h2 { font-size: 18px; margin: 0 0 17px; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
    }

    .field { flex: 1 1 180px; }
    .field.small { flex: 0 1 100px; }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-width: 0;
      background: #0b1220;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
      transition: opacity .15s;
    }

    button:hover { opacity: .86; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .primary { background: var(--accent); color: white; }
    .secondary { background: #273449; color: var(--text); }
    .success { background: #064e3b; color: #a7f3d0; }
    .danger { background: #4c1d2a; color: #fecdd3; }

    .auth-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #userStatus { color: var(--muted); font-size: 13px; }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 28px 0 16px;
      gap: 12px;
    }

    .section-heading h2 { margin: 0; }
    #syncStatus { color: var(--muted); font-size: 12px; }

    .timer-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 16px;
    }

    .timer-card { padding: 21px; min-width: 0; }

    .timer-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .timer-name {
      font-size: 17px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      border-radius: 99px;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
      background: #273449;
      color: #cbd5e1;
    }

    .status.running { background: #064e3b; color: #a7f3d0; }
    .status.finished { background: #4c1d2a; color: #fecdd3; }

    .time {
      font-size: clamp(31px, 7vw, 43px);
      font-weight: 850;
      letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
      margin: 25px 0;
      white-space: nowrap;
    }

    .timer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .timer-actions button { flex: 1 1 auto; font-size: 12px; }

    .empty, .notice {
      color: var(--muted);
      text-align: center;
      padding: 28px 12px;
      line-height: 1.7;
    }

    .notice {
      padding: 12px;
      text-align: left;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
      overflow-wrap: anywhere;
    }

    .notice.error { display: block; background: #4c1d2a; color: #fecdd3; }
    .notice.info { display: block; background: #172554; color: #bfdbfe; }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .container { width: min(100% - 22px, 1000px); padding-top: 22px; }
      .panel { padding: 16px; }
      header { align-items: start; }
      .brand { font-size: 22px; }
      .time { letter-spacing: -1px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div>
        <div class="brand">⚔ SILKROAD <span>TIMER</span></div>
        <div class="subtitle">Shared countdown timers · Real-time synchronization</div>
      </div>
      <span id="syncStatus">Connecting...</span>
    </header>

    <div id="notice" class="notice"></div>

    <section class="panel">
      <div class="auth-row">
        <div>
          <h2>Account</h2>
          <div id="userStatus">Checking login status...</div>
        </div>
        <div class="row">
          <button id="loginBtn" class="primary">Sign in with Google</button>
          <button id="logoutBtn" class="secondary" hidden>Sign out</button>
        </div>
      </div>
    </section>

    <section id="adminPanel" class="panel" hidden>
      <h2>Create a Countdown</h2>
      <form id="createForm">
        <div class="row">
          <div class="field">
            <label for="timerName">Timer name</label>
            <input id="timerName" maxlength="90" placeholder="e.g. Dungeon Reset" required>
          </div>
          <div class="field small">
            <label for="hours">Hours</label>
            <input id="hours" type="number" min="0" max="999999" value="0" required>
          </div>
          <div class="field small">
            <label for="minutes">Minutes</label>
            <input id="minutes" type="number" min="0" max="59" value="5" required>
          </div>
          <div class="field small">
            <label for="seconds">Seconds</label>
            <input id="seconds" type="number" min="0" max="59" value="0" required>
          </div>
          <button class="primary" type="submit">+ Create Timer</button>
        </div>
      </form>
    </section>

    <div class="section-heading">
      <h2>Shared Timers</h2>
      <span id="timerCount">0 timers</span>
    </div>

    <section id="timerList" class="timer-list">
      <div class="empty">Loading timers...</div>
    </section>

    <footer>
      Silkroad Timer · Powered by Supabase
    </footer>
  </main>

  <script>
    // Existing Supabase project configuration
    const SUPABASE_URL = 'https://qmsxzhnwecdiuraczspn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pPOJtppTvBkfpsIGdkW4Ww_w5GmR3oa';
    const ADMIN_EMAIL = 'zozaprivate1996@gmail.com';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let timers = [];
    let busy = false;

    const $ = id => document.getElementById(id);
    const list = $('timerList');

    function showNotice(message, type = 'error') {
      const box = $('notice');
      box.textContent = message;
      box.className = 'notice ' + type;
    }

    function clearNotice() {
      $('notice').className = 'notice';
      $('notice').textContent = '';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function formatTime(totalSeconds) {
      const seconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = seconds % 60;

      return [hours, minutes, remainder]
        .map(value => String(value).padStart(2, '0'))
        .join(':');
    }

    // Derive remaining time from the stored end time.
    // This keeps timers accurate after refresh and across devices.
    function getRemaining(timer) {
      if (!timer.is_running) {
        return Math.max(0, Number(timer.remaining_seconds) || 0);
      }

      const endTime = new Date(timer.ends_at).getTime();
      if (!Number.isFinite(endTime)) return 0;

      return Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    }

    function isAdmin() {
      return !!currentUser &&
        (currentUser.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
    }

    function updateAccountUI() {
      const admin = isAdmin();

      $('userStatus').textContent = currentUser
        ? `${currentUser.email}${admin ? ' · Administrator' : ' · Viewer'}`
        : 'You are viewing shared timers as a guest.';

      $('loginBtn').hidden = !!currentUser;
      $('logoutBtn').hidden = !currentUser;
      $('adminPanel').hidden = !admin;

      renderTimers();
    }

    async function refreshUser() {
      const { data, error } = await db.auth.getSession();
      if (error) throw error;
      currentUser = data.session?.user || null;
      updateAccountUI();
    }

    async function loadTimers(showErrors = true) {
      const { data, error } = await db
        .from('timers')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        $('syncStatus').textContent = 'Sync error';
        if (showErrors) showNotice('Could not load timers: ' + error.message);
        return;
      }

      timers = data || [];
      $('syncStatus').textContent = 'Synced';
      clearNotice();
      renderTimers();
    }

    function renderTimers() {
      $('timerCount').textContent =
        `${timers.length} ${timers.length === 1 ? 'timer' : 'timers'}`;

      if (!timers.length) {
        list.innerHTML = '<div class="empty">No timers yet. The administrator can create the first one.</div>';
        return;
      }

      const admin = isAdmin();

      list.innerHTML = timers.map(timer => {
        const remaining = getRemaining(timer);
        const finished = remaining <= 0;
        const running = !!timer.is_running && !finished;

        let status = finished ? 'FINISHED' : running ? 'RUNNING' : 'PAUSED';
        let statusClass = finished ? 'finished' : running ? 'running' : '';

        let actions = '';

        if (admin) {
          if (running) {
            actions += `<button class="secondary" data-action="pause" data-id="${timer.id}">Pause</button>`;
          } else {
            actions += `<button class="success" data-action="resume" data-id="${timer.id}" ${finished ? 'disabled' : ''}>Resume</button>`;
          }

          actions += `<button class="secondary" data-action="restart" data-id="${timer.id}">Restart</button>`;
          actions += `<button class="secondary" data-action="rename" data-id="${timer.id}">Rename</button>`;
          actions += `<button class="danger" data-action="delete" data-id="${timer.id}">Delete</button>`;
        }

        return `
          <article class="timer-card">
            <div class="timer-top">
              <div>
                <div class="timer-name">${escapeHtml(timer.name)}</div>
                <span class="status ${statusClass}">${status}</span>
              </div>
            </div>
            <div class="time" data-timer-time="${timer.id}">${formatTime(remaining)}</div>
            <div class="timer-actions">${actions}</div>
          </article>
        `;
      }).join('');
    }

    // Update the displayed numbers every second without resetting the end time.
    function tick() {
      for (const timer of timers) {
        const element = document.querySelector(`[data-timer-time="${timer.id}"]`);
        if (!element) continue;

        const remaining = getRemaining(timer);
        element.textContent = formatTime(remaining);

        const card = element.closest('.timer-card');
        const badge = card?.querySelector('.status');

        if (badge && remaining === 0 && timer.is_running) {
          badge.textContent = 'FINISHED';
          badge.className = 'status finished';
        }
      }
    }

    async function runAction(action, id) {
      if (!isAdmin()) {
        showNotice('Only the administrator can manage timers.');
        return;
      }

      if (busy) return;
      busy = true;
      clearNotice();

      try {
        const timer = timers.find(item => String(item.id) === String(id));
        if (!timer) throw new Error('Timer not found. Please refresh the page.');

        const remaining = getRemaining(timer);
        let result;

        if (action === 'pause') {
          result = await db.from('timers').update({
            remaining_seconds: remaining,
            is_running: false,
            ends_at: new Date().toISOString()
          }).eq('id', timer.id);

        } else if (action === 'resume') {
          if (remaining <= 0) {
            throw new Error('This timer has finished. Use Restart to start it again.');
          }

          result = await db.from('timers').update({
            remaining_seconds: remaining,
            is_running: true,
            ends_at: new Date(Date.now() + remaining * 1000).toISOString()
          }).eq('id', timer.id);

        } else if (action === 'restart') {
          const duration = Number(timer.duration_seconds) || 0;
          if (duration <= 0) {
            throw new Error('This timer has no saved original duration. Create a new timer.');
          }

          result = await db.from('timers').update({
            remaining_seconds: duration,
            is_running: true,
            ends_at: new Date(Date.now() + duration * 1000).toISOString()
          }).eq('id', timer.id);

        } else if (action === 'rename') {
          const newName = prompt('Enter the new timer name:', timer.name);
          if (newName === null) return;

          const name = newName.trim();
          if (!name || name.length > 90) {
            throw new Error('The name must contain between 1 and 90 characters.');
          }

          result = await db.from('timers').update({ name }).eq('id', timer.id);

        } else if (action === 'delete') {
          if (!confirm(`Delete "${timer.name}" for everyone? This cannot be undone.`)) return;

          result = await db.from('timers').delete().eq('id', timer.id);
        }

        if (result?.error) throw result.error;
        await loadTimers();
      } catch (error) {
        showNotice(error.message || 'Something went wrong.');
      } finally {
        busy = false;
      }
    }

    list.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      runAction(button.dataset.action, button.dataset.id);
    });

    $('createForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!isAdmin()) {
        showNotice('Sign in with the administrator account to create timers.');
        return;
      }

      const name = $('timerName').value.trim();
      const hours = Number($('hours').value);
      const minutes = Number($('minutes').value);
      const seconds = Number($('seconds').value);

      if (!name || name.length > 90) {
        showNotice('Enter a timer name between 1 and 90 characters.');
        return;
      }

      if (![hours, minutes, seconds].every(Number.isSafeInteger) ||
          hours < 0 || hours > 999999 ||
          minutes < 0 || minutes > 59 ||
          seconds < 0 || seconds > 59) {
        showNotice('Enter valid hours, minutes, and seconds.');
        return;
      }

      const duration = hours * 3600 + minutes * 60 + seconds;

      if (!Number.isSafeInteger(duration) || duration <= 0) {
        showNotice('The timer duration must be greater than zero.');
        return;
      }

      const now = Date.now();

      try {
        const { error } = await db.from('timers').insert({
          name,
          duration_seconds: duration,
          remaining_seconds: duration,
          is_running: true,
          ends_at: new Date(now + duration * 1000).toISOString()
        });

        if (error) throw error;

        $('timerName').value = '';
        $('hours').value = '0';
        $('minutes').value = '5';
        $('seconds').value = '0';

        await loadTimers();
      } catch (error) {
        showNotice('Could not create timer: ' + (error.message || 'Unknown error'));
      }
    });

    $('loginBtn').addEventListener('click', async () => {
      clearNotice();

      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });

      if (error) showNotice('Google sign-in failed: ' + error.message);
    });

    $('logoutBtn').addEventListener('click', async () => {
      const { error } = await db.auth.signOut();
      if (error) {
        showNotice('Could not sign out: ' + error.message);
        return;
      }

      currentUser = null;
      updateAccountUI();
      await loadTimers();
    });

    // Defer auth work so the Supabase auth callback cannot block its own requests.
    db.auth.onAuthStateChange(() => {
      setTimeout(async () => {
        try {
          await refreshUser();
          await loadTimers();
        } catch (error) {
          showNotice('Authentication error: ' + error.message);
        }
      }, 0);
    });

    // Realtime is an extra sync mechanism; polling below is the fallback.
    db.channel('shared-timers')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'timers'
      }, () => loadTimers(false))
      .subscribe();

    // Recover when the browser tab becomes active again.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadTimers(false);
    });

    // Initialize and keep the countdown display ticking.
    (async function init() {
      try {
        await refreshUser();
        await loadTimers();
      } catch (error) {
        showNotice('Could not initialize the app: ' + error.message);
      }

      setInterval(tick, 1000);
      setInterval(() => loadTimers(false), 15000);
    })();
  </script>
</body>
</html>
```
